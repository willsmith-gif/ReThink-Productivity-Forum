<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Portal — Store 0412 Northgate</title>
<style>
:root{
  --chrome:#1f3a5f; --bg:#eef1f4; --panel:#ffffff;
  --ink:#1b2733; --ink-2:#556370; --ink-3:#7d8994; --line:#d2d9df;
  --red:#b3261e; --red-bg:#fdecea; --amb:#8a6100; --amb-bg:#fdf5e3;
  --grn:#1c6b3c; --grn-bg:#ecf6ef; --link:#1a5fa8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(31,58,95,.12)}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:56px;
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--chrome);color:#fff;
  padding:7px 12px;display:flex;align-items:center;gap:9px;
  box-shadow:0 1px 0 rgba(0,0,0,.25);
}
.topbar .mark{
  width:20px;height:20px;border:1.5px solid rgba(255,255,255,.7);border-radius:2px;
  display:grid;place-items:center;font-size:9px;font-weight:700;flex:none;
}
.topbar .who{font-size:11px;line-height:1.25;flex:1;min-width:0}
.topbar .who b{display:block;font-size:12.5px;font-weight:600}
.topbar .who span{color:rgba(255,255,255,.72)}
.stamp{font-size:10px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3;flex:none}

.crumb{
  background:#e2e7ec;border-bottom:1px solid var(--line);padding:6px 12px;
  font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px;
  position:sticky;top:35px;z-index:19;overflow-x:auto;white-space:nowrap;
}
.crumb button{font:inherit;font-weight:600;color:var(--link);background:none;border:none;padding:2px 0;cursor:pointer}
.crumb .sep{color:var(--ink-3)}
.crumb .here{color:var(--ink-2)}

.wrap{padding:10px 10px 0}
.panel{background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.panel > h2{
  margin:0;padding:8px 11px;font-size:12px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line);background:#f7f9fa;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.panel > h2 em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink-3)}
.note{font-size:11px;color:var(--ink-3);padding:9px 11px;border-top:1px solid #e6ebef}

.tiles{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:10px}
@media(min-width:520px){.tiles{grid-template-columns:1fr 1fr 1fr}}
.tile{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--chrome);
  padding:11px 12px;font:inherit;color:inherit;cursor:pointer;
}
.tile b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.tile small{display:block;color:var(--ink-2);font-size:11px}
.tile .badge{float:right;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:8px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #e6ebef;vertical-align:top}
th{font-size:10.5px;font-weight:600;color:var(--ink-2);background:#f7f9fa;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click td:first-child{color:var(--link);font-weight:600}
tr.click:active{background:#f0f5fa}
tbody tr:last-child td{border-bottom:none}
.tot td{background:#f7f9fa;font-weight:700;border-top:1px solid var(--line)}

.up{color:var(--red);font-weight:700}
.dn{color:var(--grn);font-weight:700}
.flat{color:var(--ink-3)}

.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px;white-space:nowrap}
.pill.r{background:var(--red-bg);color:var(--red)}
.pill.a{background:var(--amb-bg);color:var(--amb)}
.pill.g{background:var(--grn-bg);color:var(--grn)}
.pill.n{background:#eef1f4;color:var(--ink-2)}

.kpi{
  display:flex;align-items:center;gap:10px;padding:10px 11px;
  border-bottom:1px solid #e6ebef;cursor:pointer;width:100%;
  background:none;border-left:none;border-right:none;border-top:none;font:inherit;text-align:left;color:inherit;
}
.kpi:last-child{border-bottom:none}
.kpi:active{background:#f0f5fa}
.kpi .rag{width:8px;height:36px;flex:none;background:var(--ink-3)}
.kpi .rag.r{background:var(--red)} .kpi .rag.a{background:var(--amb)} .kpi .rag.g{background:var(--grn)}
.kpi .lab{flex:1;min-width:0}
.kpi .lab b{display:block;font-size:12.5px;font-weight:600;color:var(--link)}
.kpi .lab small{color:var(--ink-3);font-size:10.5px}
.kpi .val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.kpi .val b{display:block;font-size:14px;font-weight:700}
.kpi .val small{font-size:10.5px}

.row{
  display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid #e6ebef;
  cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;
  font:inherit;text-align:left;color:inherit;align-items:flex-start;
}
.row:last-child{border-bottom:none}
.row:active{background:#f0f5fa}
.row .dot{width:7px;height:7px;border-radius:50%;background:var(--link);margin-top:5px;flex:none}
.row .dot.read{background:transparent;border:1px solid #cfd6dc}
.row .body{flex:1;min-width:0}
.row .body .from{font-size:11px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.row .body .subj{font-size:12.5px;margin:1px 0}
.row.unread .body .subj{font-weight:700}
.row .body .prev{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.doc{padding:12px}
.doc .hd{border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}
.doc .hd h3{margin:0 0 4px;font-size:14.5px;line-height:1.3}
.doc .hd .meta{font-size:11px;color:var(--ink-2)}
.doc p{margin:0 0 9px;max-width:62ch}
.doc ul,.doc ol{margin:0 0 9px;padding-left:20px;max-width:62ch}
.doc li{margin-bottom:3px}
.doc .sig{color:var(--ink-3);font-size:11px;margin-top:12px}
.callout{border:1px solid var(--line);border-left:3px solid var(--ink-3);background:#f7f9fa;padding:9px 11px;margin:0 0 10px;font-size:12px}
.callout.r{border-left-color:var(--red);background:var(--red-bg)}
.callout.a{border-left-color:var(--amb);background:var(--amb-bg)}

.drill{display:grid;gap:7px;padding:11px}
.drill button{
  text-align:left;font:inherit;background:#f7f9fa;border:1px solid var(--line);
  padding:9px 11px;cursor:pointer;color:inherit;
}
.drill button b{display:block;color:var(--link);font-size:12.5px}
.drill button small{color:var(--ink-3);font-size:11px}
.drill button:active{background:#eef4fa}

.foot{padding:14px 12px 24px;font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.5}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
</style>
</head>

/* ============================ HELPERS ============================ */

const V = {};

function kpi(rag,name,val,delta,dir,dest,sub){
  return `<button class="kpi" onclick="go('${dest}')">
    <span class="rag ${rag}"></span>
    <span class="lab"><b>${name}</b>${sub?`<small>${sub}</small>`:''}</span>
    <span class="val"><b>${val}</b><small class="${dir==='up'?'up':dir==='dn'?'dn':'flat'}">${delta}</small></span>
  </button>`;
}
function drill(items){
  return `<div class="drill">${items.map(([r,b,s])=>
    `<button onclick="go('${r}')"><b>${b}</b><small>${s}</small></button>`).join('')}</div>`;
}
function P(title,em,inner,note){
  return `<div class="panel"><h2>${title}${em?`<em>${em}</em>`:''}</h2>${inner}${note?`<div class="note">${note}</div>`:''}</div>`;
}

V.home = () => ({

/* ============================ ROUTER ============================ */

function resolve(route){
  if(route.includes(':')){
    const [k,arg] = route.split(':');
    return V[k+':'](arg);
  }
  return V[route]();
}

function go(route){
  const v = resolve(route);
  const c = document.getElementById('crumb');
  if(route==='home'){
    c.innerHTML = '<span class="here">Home</span>';
  } else {
    c.innerHTML = v.crumb.map(([r,l])=>`<button onclick="go('${r}')">${l}</button>`).join('<span class="sep">›</span>');
  }
  document.getElementById('view').innerHTML = v.html;
  window.scrollTo(0,0);
}

go('home');
