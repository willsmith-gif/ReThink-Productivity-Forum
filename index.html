<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Portal — Store 0412 Northgate</title>
<style>
:root{
  --chrome:#1f3a5f; --bg:#eef1f4; --panel:#ffffff;
  --ink:#1b2733; --ink-2:#556370; --ink-3:#7d8994; --line:#d2d9df;
  --red:#b3261e; --red-bg:#fdecea; --amb:#8a6100; --amb-bg:#fdf5e3;
  --grn:#1c6b3c; --grn-bg:#ecf6ef; --link:#1a5fa8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(31,58,95,.12)}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:56px;
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--chrome);color:#fff;
  padding:7px 12px;display:flex;align-items:center;gap:9px;
  box-shadow:0 1px 0 rgba(0,0,0,.25);
}
.topbar .mark{
  width:20px;height:20px;border:1.5px solid rgba(255,255,255,.7);border-radius:2px;
  display:grid;place-items:center;font-size:9px;font-weight:700;flex:none;
}
.topbar .who{font-size:11px;line-height:1.25;flex:1;min-width:0}
.topbar .who b{display:block;font-size:12.5px;font-weight:600}
.topbar .who span{color:rgba(255,255,255,.72)}
.stamp{font-size:10px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3;flex:none}

.crumb{
  background:#e2e7ec;border-bottom:1px solid var(--line);padding:6px 12px;
  font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px;
  position:sticky;top:35px;z-index:19;overflow-x:auto;white-space:nowrap;
}
.crumb button{font:inherit;font-weight:600;color:var(--link);background:none;border:none;padding:2px 0;cursor:pointer}
.crumb .sep{color:var(--ink-3)}
.crumb .here{color:var(--ink-2)}

.wrap{padding:10px 10px 0}
.panel{background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.panel > h2{
  margin:0;padding:8px 11px;font-size:12px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line);background:#f7f9fa;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.panel > h2 em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink-3)}
.note{font-size:11px;color:var(--ink-3);padding:9px 11px;border-top:1px solid #e6ebef}

.tiles{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:10px}
@media(min-width:520px){.tiles{grid-template-columns:1fr 1fr 1fr}}
.tile{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--chrome);
  padding:11px 12px;font:inherit;color:inherit;cursor:pointer;
}
.tile b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.tile small{display:block;color:var(--ink-2);font-size:11px}
.tile .badge{float:right;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:8px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #e6ebef;vertical-align:top}
th{font-size:10.5px;font-weight:600;color:var(--ink-2);background:#f7f9fa;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click td:first-child{color:var(--link);font-weight:600}
tr.click:active{background:#f0f5fa}
tbody tr:last-child td{border-bottom:none}
.tot td{background:#f7f9fa;font-weight:700;border-top:1px solid var(--line)}

.up{color:var(--red);font-weight:700}
.dn{color:var(--grn);font-weight:700}
.flat{color:var(--ink-3)}

.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px;white-space:nowrap}
.pill.r{background:var(--red-bg);color:var(--red)}
.pill.a{background:var(--amb-bg);color:var(--amb)}
.pill.g{background:var(--grn-bg);color:var(--grn)}
.pill.n{background:#eef1f4;color:var(--ink-2)}

.kpi{
  display:flex;align-items:center;gap:10px;padding:10px 11px;
  border-bottom:1px solid #e6ebef;cursor:pointer;width:100%;
  background:none;border-left:none;border-right:none;border-top:none;font:inherit;text-align:left;color:inherit;
}
.kpi:last-child{border-bottom:none}
.kpi:active{background:#f0f5fa}
.kpi .rag{width:8px;height:36px;flex:none;background:var(--ink-3)}
.kpi .rag.r{background:var(--red)} .kpi .rag.a{background:var(--amb)} .kpi .rag.g{background:var(--grn)}
.kpi .lab{flex:1;min-width:0}
.kpi .lab b{display:block;font-size:12.5px;font-weight:600;color:var(--link)}
.kpi .lab small{color:var(--ink-3);font-size:10.5px}
.kpi .val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.kpi .val b{display:block;font-size:14px;font-weight:700}
.kpi .val small{font-size:10.5px}

.row{
  display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid #e6ebef;
  cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;
  font:inherit;text-align:left;color:inherit;align-items:flex-start;
}
.row:last-child{border-bottom:none}
.row:active{background:#f0f5fa}
.row .dot{width:7px;height:7px;border-radius:50%;background:var(--link);margin-top:5px;flex:none}
.row .dot.read{background:transparent;border:1px solid #cfd6dc}
.row .body{flex:1;min-width:0}
.row .body .from{font-size:11px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.row .body .subj{font-size:12.5px;margin:1px 0}
.row.unread .body .subj{font-weight:700}
.row .body .prev{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.doc{padding:12px}
.doc .hd{border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}
.doc .hd h3{margin:0 0 4px;font-size:14.5px;line-height:1.3}
.doc .hd .meta{font-size:11px;color:var(--ink-2)}
.doc p{margin:0 0 9px;max-width:62ch}
.doc ul,.doc ol{margin:0 0 9px;padding-left:20px;max-width:62ch}
.doc li{margin-bottom:3px}
.doc .sig{color:var(--ink-3);font-size:11px;margin-top:12px}
.callout{border:1px solid var(--line);border-left:3px solid var(--ink-3);background:#f7f9fa;padding:9px 11px;margin:0 0 10px;font-size:12px}
.callout.r{border-left-color:var(--red);background:var(--red-bg)}
.callout.a{border-left-color:var(--amb);background:var(--amb-bg)}

.drill{display:grid;gap:7px;padding:11px}
.drill button{
  text-align:left;font:inherit;background:#f7f9fa;border:1px solid var(--line);
  padding:9px 11px;cursor:pointer;color:inherit;
}
.drill button b{display:block;color:var(--link);font-size:12.5px}
.drill button small{color:var(--ink-3);font-size:11px}
.drill button:active{background:#eef4fa}

.foot{padding:14px 12px 24px;font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.5}

/* charts */
.cw{padding:10px 4px 2px}
.cw svg{width:100%;height:auto;display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
/* tableau chrome */
.filt{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;background:#e2e7ec;border:1px solid var(--line);border-bottom:none}
.fsel{background:#fff;border:1px solid #c3ccd4;font-size:10.5px;padding:3px 7px;color:var(--ink-2);white-space:nowrap}
.fsel b{color:var(--ink-3);font-weight:400}
.fbtn{background:var(--chrome);color:#fff;font-size:10.5px;font-weight:600;padding:3px 10px;border:1px solid var(--chrome)}
.tabs{display:flex;overflow-x:auto;background:#fff;border:1px solid var(--line);border-bottom:none}
.tab{font:inherit;font-size:11px;padding:7px 12px;background:#f2f4f6;border:none;border-right:1px solid var(--line);
     border-bottom:1px solid var(--line);color:var(--link);cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:var(--ink);font-weight:700;border-bottom:1px solid #fff}
.rmeta{font-size:10.5px;color:var(--ink-3);padding:2px 2px 12px;line-height:1.5}
.tsm{font-size:11px;color:var(--ink-3)}
.ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--link)}
/* app launcher */
.launch{display:flex;flex-direction:column;align-items:center;
        min-height:calc(100vh - 130px);text-align:center;padding:30px 12px 10px}
.lhead{font-size:19px;font-weight:600;letter-spacing:-.01em}
.lsub{font-size:12px;color:var(--ink-2);margin-top:2px;margin-bottom:30px}
.lfoot{font-size:10.5px;color:var(--ink-3);margin-top:30px;padding-bottom:10px}
.apps{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.app{background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:0;width:88px}
.app b{display:block;font-size:12px;font-weight:600;margin-top:9px}
.app .ic{position:relative;width:68px;height:68px;margin:0 auto;border-radius:16px;
         background:var(--chrome);display:grid;place-items:center;box-shadow:0 1px 3px rgba(22,41,67,.28)}
.app .ic.bi{background:#2f6b4f}
.app .ic.tk{background:#6b4a86}
.app .ic svg{width:40px;height:40px}
.app .ic .dot{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;
              background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:22px;
              padding:0 6px;box-shadow:0 0 0 2px var(--bg)}
.olabel{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
        margin:40px 0 18px;width:100%;max-width:340px;text-align:left;
        border-bottom:1px solid #dde3e8;padding-bottom:6px}
.olabel em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);opacity:.8}
.apps2{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px;max-width:340px;width:100%}
.app2{text-align:center;cursor:default;user-select:none;opacity:.9}
.app2 .ic2{width:62px;height:62px;margin:0 auto;border-radius:15px;
           display:grid;place-items:center;box-shadow:0 1px 3px rgba(22,41,67,.24)}
.app2 .ic2 svg{width:36px;height:36px}
.app2 span{display:block;font-size:10px;line-height:1.25;color:var(--ink-2);margin-top:7px}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">SP</div>
  <div class="who"><b>Store 0412 — Northgate</b><span>A. Mercer, Store Manager</span></div>
  <div class="stamp">Data to<br>close Sun</div>
</div>

<div class="crumb" id="crumb"></div>
<div class="wrap" id="view"></div>
<div class="foot">Store Portal 4.2.1 &nbsp;|&nbsp; Reporting week 36 &nbsp;|&nbsp; Refreshed 06:14</div>

<script>
/* ============================ MAIL ============================ */

const MAIL = [
  {id:1, from:"Regional Communications", when:"Mon 06:00", unread:true,
   subj:"Morning trading update — Monday, week 37",
   prev:"Trading update, this week's focus, colleague notices.",
   body:`<p>Good morning. Regional trading finished week 36 ahead of budget by 0.6%. Chilled and food to go continue to outperform, bakery remains soft.</p>
   <p>This week's operational focus is availability. Please make sure gap scans are completed daily before 11:00 and that the results are actioned the same day rather than left to the following morning.</p>
   <p>Colleague notices: the pension provider webinar runs Wednesday at 14:00, and the long service awards nominations close at the end of the month.</p>
   <p>Reminder that the summer holiday request window has now closed. Late requests should be discussed with your line manager.</p>
   <div class="sig">Regional Communications — daily distribution</div>`},


  {id:3, from:"Space & Range", when:"Mon 06:20", unread:true,
   subj:"Planogram 41C — chilled meals bay, implement by Friday",
   prev:"Two facings lost on ready meals, one gained on food to go.",
   body:`<p>Planogram 41C is live for your format from Friday. Net effect on the chilled meals bay is two facings out, replaced by an extended food to go block.</p>
   <p>Print the plan from the range portal, reset overnight, and confirm completion in Tasks. Photographs of the completed bay are not required for this change.</p>
   <div class="sig">Space &amp; Range</div>`},

  {id:4, from:"Goods In Notifications", when:"Sat 04:02", unread:true,
   subj:"Delivery 4471 — receipt confirmation",
   prev:"218 lines received and booked in at 04:02.",
   body:`<p>Delivery 4471 was received and booked in at 04:02. 218 lines were processed.</p>
   <p>Three lines were recorded outside tolerance and are listed in the goods-in variance report. Variance lines auto-accept 48 hours after receipt if no store challenge is raised. Once accepted, no supplier claim can be made.</p>
   <table><tr><th>Line</th><th class="n">Ordered</th><th class="n">Received</th></tr>
   <tr><td>Ready Meal — Lasagne 400g</td><td class="n">24</td><td class="n">96</td></tr>
   <tr><td>Fresh Soup — Tomato 600g</td><td class="n">18</td><td class="n">54</td></tr>
   <tr><td>Pizza — Margherita 425g</td><td class="n">20</td><td class="n">60</td></tr></table>
   <div class="sig">Automated — do not reply</div>`},

  {id:5, from:"Marketing", when:"Mon 05:48", unread:true,
   subj:"Autumn campaign — POS arriving week 38",
   prev:"Two cages. Please do not display before the Monday launch.",
   body:`<p>Autumn campaign point of sale arrives week 38 in two cages, labelled by fixture. Hold in the stockroom and do not display before the Monday launch.</p>
   <p>The campaign covers hot food to go, soup and bakery. Header boards are reusable this cycle so please retain them after the campaign closes rather than sending them for recycling.</p>
   <div class="sig">Marketing</div>`},

  {id:6, from:"Rota & Scheduling", when:"Sun 18:44", unread:true,
   subj:"Week 37 rota — 3 shifts unassigned",
   prev:"Automated check. Unassigned shifts do not block rota publication.",
   body:`<p>The automated rota check has identified three shifts with no colleague assigned for week 37.</p>
   <table><tr><th>Day</th><th>Shift</th><th>Dept</th></tr>
   <tr><td>Tuesday</td><td>14:00 – 22:00</td><td>Fresh</td></tr>
   <tr><td>Wednesday</td><td>14:00 – 22:00</td><td>Fresh</td></tr>
   <tr><td>Thursday</td><td>15:00 – 22:00</td><td>Fresh</td></tr></table>
   <p style="margin-top:10px">Unassigned shifts do not prevent the rota from publishing. Assign, offer out, or raise an agency request via the scheduling portal.</p>
   <div class="sig">Rota &amp; Scheduling — automated</div>`},

  {id:7, from:"Payroll Operations", when:"Mon 07:15", unread:false,
   subj:"Week 36 timesheets — sign-off closes Tuesday 12:00",
   prev:"Unapproved hours will be paid as scheduled and corrected in arrears.",
   body:`<p>Timesheet approval for week 36 closes at 12:00 Tuesday. Exceptions not resolved before cut-off will be paid as scheduled and adjusted in the following period.</p>
   <p>Please check clocking exceptions before approving. Missed and amended clockings are listed in the payroll report and should be reviewed rather than approved in bulk.</p>
   <div class="sig">Payroll Operations</div>`},

  {id:8, from:"Availability Reporting", when:"Mon 05:30", unread:false,
   subj:"Gap scan results — Sunday",
   prev:"Automated summary. 34 gaps recorded across 6 bays.",
   body:`<p>Sunday gap scan recorded 34 gaps across six bays. This is the automated summary and no action is generated from it directly.</p>
   <table><tr><th>Bay</th><th class="n">Gaps</th></tr>
   <tr><td>Chilled ready meals</td><td class="n">9</td></tr>
   <tr><td>Ambient grocery</td><td class="n">8</td></tr>
   <tr><td>Produce</td><td class="n">6</td></tr>
   <tr><td>Bakery</td><td class="n">5</td></tr>
   <tr><td>Household</td><td class="n">4</td></tr>
   <tr><td>Frozen</td><td class="n">2</td></tr></table>
   <div class="sig">Availability Reporting — automated daily</div>`},

  {id:9, from:"IT Service Desk", when:"Sun 14:10", unread:false,
   subj:"Handheld HT-0412-03 offline since Thursday",
   prev:"Device has not checked in for 4 days. Please locate and dock.",
   body:`<p>Handheld HT-0412-03 has not connected for four days. Undocked handhelds do not sync markdown or rotation scans, which can leave gaps in compliance reporting.</p>
   <p>Please locate the device and dock it. If it cannot be found, raise a loss report.</p>
   <div class="sig">IT Service Desk — ticket INC0294471</div>`},

  {id:10, from:"Facilities", when:"Fri 09:48", unread:false,
   subj:"Chiller 4 — engineer attended, closed as no fault found",
   prev:"Call raised Wednesday, attended Thursday. Temperature logs within range.",
   body:`<p>The engineer attended Chiller 4 on Thursday following your call. Temperature logs for the preceding seven days were reviewed and found within range throughout. The call has been closed as no fault found.</p>
   <p>If product quality issues continue in that bay, re-raise with photographs.</p>
   <div class="sig">Facilities — job 88214</div>`},

  {id:11, from:"Learning & Development", when:"Fri 11:02", unread:false,
   subj:"2 colleagues overdue on food safety refresher",
   prev:"Overdue certification restricts unsupervised work in Fresh.",
   body:`<p>Two colleagues in Fresh are past their refresher date for food safety. Until completed they should not work unsupervised on chilled or bakery.</p>
   <p>Modules take 40 minutes and should be booked as paid training hours.</p>
   <div class="sig">Learning &amp; Development</div>`},

  {id:12, from:"HR Shared Services", when:"Thu 10:05", unread:false,
   subj:"Return to work meeting outstanding — 1 colleague",
   prev:"Should be held on the first shift back and recorded in the people system.",
   body:`<p>A return to work discussion is outstanding for one colleague in Fresh following four days of absence. This should be held on the first shift back and recorded in the people system.</p>
   <p>Their absence score has passed the first trigger point, which means a formal review is required rather than an informal conversation.</p>
   <div class="sig">HR Shared Services</div>`},

  {id:13, from:"Health & Safety", when:"Tue 16:00", unread:false,
   subj:"Fire alarm test overdue by 6 days",
   prev:"Weekly test must be recorded in the H&S log.",
   body:`<p>Your weekly fire alarm test has not been recorded for six days. Complete the test and log it in the H&amp;S register.</p>
   <div class="sig">Health &amp; Safety — automated</div>`},

  {id:14, from:"Charity Partnership", when:"Wed 08:15", unread:false,
   subj:"Collection week 38 — nominate a colleague lead",
   prev:"Bucket and tabards are in your delivery. Log the name by Friday.",
   body:`<p>Collection week runs from week 38. Materials are in your delivery. Please nominate a colleague lead and log their name on the portal by Friday.</p>
   <p>Last year the region raised just over £61,000 and stores that nominated a lead early raised on average 40% more than those that did not.</p>
   <div class="sig">Charity Partnership</div>`},

  {id:15, from:"Store Ordering Support", when:"Wed 13:30", unread:false,
   subj:"Reminder: manual order edits are reported weekly",
   prev:"Weekly reminder issued to all stores.",
   body:`<p>Manual overrides to system-generated orders are logged and reported weekly. Overrides should be used only where you have information the forecast does not.</p>
   <div class="sig">Store Ordering Support — automated weekly</div>`},

  {id:16, from:"Uniform & Consumables", when:"Tue 09:30", unread:false,
   subj:"Order window closes Friday",
   prev:"Next window opens in four weeks.",
   body:`<p>The uniform and consumables order window closes Friday. Late requests wait for the next cycle in four weeks.</p>
   <div class="sig">Uniform &amp; Consumables</div>`},

  {id:17, from:"Regional Communications", when:"Fri 16:20", unread:false,
   subj:"Long service awards — nominations open",
   prev:"Nominations close at the end of the month.",
   body:`<p>Nominations for the long service awards are now open for colleagues reaching 5, 10, 15 and 25 years. Submit via the people portal.</p>
   <div class="sig">Regional Communications</div>`},

  {id:2, from:"Cash & Banking", when:"Fri 08:12", unread:true,
   subj:"Deposit reconciliation — 1 item open",
   prev:"Automated notice. Deposit D-0412-2611 not matched to a bank credit.",
   body:`<p>The following deposit has not been matched to a bank credit file entry.</p>
   <table><tr><th>Reference</th><th>Date</th><th class="n">Declared</th><th class="n">Credited</th></tr>
   <tr><td>D-0412-2611</td><td>Thursday</td><td class="n">£14,820</td><td class="n">£13,580</td></tr></table>
   <p style="margin-top:10px">Open items appear in the cash office reconciliation report. Variances above the policy threshold require a variance investigation form to be completed within 72 hours of identification. Carrier claims cannot be raised once the reporting window has closed.</p>
   <div class="sig">Cash &amp; Banking — automated daily reconciliation</div>`},

  {id:19, from:"Promotions & Campaigns", when:"Thu 12:05", unread:false,
   subj:"World Foods campaign — siting confirmation outstanding",
   prev:"6 of 14 lines not recorded as sited. Siting is confirmed by fixture scan.",
   body:`<p>Six of fourteen lines in the World Foods campaign are not recorded as sited at your store. Siting is confirmed by scanning the fixture label and may lag by up to 48 hours.</p>
   <p>Campaign performance by store is published in the promotions report each Monday.</p>
   <div class="sig">Promotions &amp; Campaigns</div>`},

  {id:18, from:"Energy & Sustainability", when:"Thu 07:40", unread:false,
   subj:"Overnight lighting audit — your store scored 92%",
   prev:"No action required. Included for awareness.",
   body:`<p>The overnight lighting audit for your store returned 92% compliance. Two zones were found lit outside the scheduled period. No action is required at store level as the schedule has been corrected centrally.</p>
   <div class="sig">Energy &amp; Sustainability</div>`}
];

/* ============================ TASKS ============================ */

const TASKS = [
  {id:1, t:"Complete daily gap scan", due:"Due today 11:00", st:"a", stx:"Not started", cat:"Availability",
   body:`<p>Scan all six bays and action results the same day. This week's regional operational focus.</p>`},
  {id:2, t:"Record weekly fire alarm test", due:"Overdue by 6 days", st:"r", stx:"Not started", cat:"H&S",
   body:`<p>Weekly test outstanding. Complete and log in the H&amp;S register.</p>`},
  {id:3, t:"Sign off week 36 timesheets", due:"Due today 12:00", st:"a", stx:"In progress", cat:"Payroll",
   body:`<p>Check clocking exceptions before approving. Missed and amended clockings are listed in the payroll report and should be reviewed individually rather than approved in bulk.</p>`},
  {id:4, t:"Complete cash variance investigation form", due:"Due today", st:"a", stx:"Not started", cat:"Cash Office",
   body:`<p>Deposit D-0412-2611 remains unmatched. Complete the variance investigation form and submit to Loss Prevention.</p>

const V = {};

function kpi(rag,name,val,delta,dir,dest,sub){
  return `<button class="kpi" onclick="go('${dest}')">
    <span class="rag ${rag}"></span>
    <span class="lab"><b>${name}</b>${sub?`<small>${sub}</small>`:''}</span>
    <span class="val"><b>${val}</b><small class="${dir==='up'?'up':dir==='dn'?'dn':'flat'}">${delta}</small></span>
  </button>`;
}
function drill(items){
  return `<div class="drill">${items.map(([r,b,s])=>
    `<button onclick="go('${r}')"><b>${b}</b><small>${s}</small></button>`).join('')}</div>`;
}
function P(title,em,inner,note){
  return `<div class="panel"><h2>${title}${em?`<em>${em}</em>`:''}</h2>${inner}${note?`<div class="note">${note}</div>`:''}</div>`;
}

/* ============================ CHARTS ============================ */

function fmtV(v,t){
  if(t==='gbp') return '£'+Math.round(v).toLocaleString();
  if(t==='gbpk') return '£'+(v/1000).toFixed(0)+'k';
  if(t==='pct') return v.toFixed(1)+'%';
  if(t==='min') return Math.round(v)+'m';
  return Math.round(v).toLocaleString();
}
function niceB(mn,mx){
  if(mn===mx) return [mn-1,mx+1];
  const s=mx-mn; return [Math.max(0,mn-s*0.15), mx+s*0.15];
}
function svgWrap(inner,h){
  return `<div class="cw"><svg viewBox="0 0 640 ${h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${inner}</svg></div>`;
}

function lineChart(labels, series, o){
  o=o||{}; const h=o.h||190, t=o.fmt||'num';
  const legend = series.length>1;
  const TH = h + (legend?16:0);
  const PL=54,PR=14,PT=12,PB=24;
  const W=640-PL-PR, H=h-PT-PB;
  const all=[].concat(...series.map(s=>s.data));
  const b = (o.min!==undefined)?[o.min,o.max]:niceB(Math.min.apply(null,all),Math.max.apply(null,all));
  const mn=b[0],mx=b[1];
  const X=i=>PL+(labels.length<2?W/2:W*i/(labels.length-1));
  const Y=v=>PT+H*(1-(v-mn)/((mx-mn)||1));
  let g='';
  for(let i=0;i<=4;i++){
    const y=PT+H*i/4, v=mx-(mx-mn)*i/4;
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${640-PR}" y2="${y.toFixed(1)}" stroke="#e6ebef"/>`
      +`<text x="${PL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#7d8994">${fmtV(v,t)}</text>`;
  }
  labels.forEach((l,i)=>{ g+=`<text x="${X(i).toFixed(1)}" y="${h-7}" text-anchor="middle" font-size="10.5" fill="#7d8994">${l}</text>`; });
  series.forEach(s=>{
    const d=s.data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"${s.dash?' stroke-dasharray="5 4"':''}/>`;
    if(!s.dash) s.data.forEach((v,i)=>{ g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="${s.color}"/>`; });
  });
  if(legend){
    let lx=PL;
    series.forEach(s=>{
      g+=`<rect x="${lx}" y="${h+3}" width="10" height="3" fill="${s.color}"/>`
        +`<text x="${lx+15}" y="${h+7.5}" font-size="10.5" fill="#556370">${s.name}</text>`;
      lx+=25+s.name.length*5.7;
    });
  }
  return svgWrap(g,TH);
}

function barChart(labels, groups, o){
  o=o||{}; const h=o.h||190, t=o.fmt||'num';
  const legend = groups.length>1 || o.legend;
  const TH = h + (legend?16:0);
  const PL=54,PR=14,PT=12,PB=26;
  const W=640-PL-PR, H=h-PT-PB;
  const all=[].concat(...groups.map(s=>s.data));
  const mx = (o.max!==undefined)?o.max:Math.max.apply(null,all)*1.15;
  const Y=v=>PT+H*(1-v/(mx||1));
  const slot=W/labels.length, bw=Math.min(30,(slot*0.62)/groups.length);
  let g='';
  for(let i=0;i<=4;i++){
    const y=PT+H*i/4, v=mx-mx*i/4;
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${640-PR}" y2="${y.toFixed(1)}" stroke="#e6ebef"/>`
      +`<text x="${PL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#7d8994">${fmtV(v,t)}</text>`;
  }
  labels.forEach((l,i)=>{
    const cx=PL+slot*i+slot/2;
    g+=`<text x="${cx.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#7d8994">${l}</text>`;
    groups.forEach((s,j)=>{
      const v=s.data[i]; if(v==null) return;
      const x=cx-(bw*groups.length)/2+bw*j;
      const y=Y(v), col=(s.colors&&s.colors[i])||s.color;
      g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(PT+H-y).toFixed(1)}" fill="${col}"/>`;
    });
  });
  if(legend){
    let lx=PL;
    groups.forEach(s=>{
      g+=`<rect x="${lx}" y="${h+2}" width="10" height="6" fill="${s.color}"/>`
        +`<text x="${lx+15}" y="${h+7.5}" font-size="10.5" fill="#556370">${s.name}</text>`;
      lx+=25+s.name.length*5.7;
    });
  }
  return svgWrap(g,TH);
}

/* ============================ ROUTER ============================ */

function resolve(route){
  if(route.includes(':')){
    const [k,arg] = route.split(':');
    return V[k+':'](arg);
  }
  return V[route]();
}

function go(route){
  const v = resolve(route);
  const c = document.getElementById('crumb');
  if(route==='home'){
    c.style.display='none'; c.innerHTML='';
  } else {
    c.style.display='flex';
    c.innerHTML = v.crumb.map(([r,l])=>`<button onclick="go('${r}')">${l}</button>`).join('<span class="sep">›</span>');
  }
  document.getElementById('view').innerHTML = v.html;
  window.scrollTo(0,0);
}

go('home');
